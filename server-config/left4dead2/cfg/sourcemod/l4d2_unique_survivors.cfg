// [L4D2] Unique Survivors
// Switch duplicate-character survivor bots to an unused character (0 = off).
l4d2_unique_survivors_enable "1"
// 1 = Zoey is used like everyone else (number 5, her own HUD portrait). 0 = never use Zoey's number or model (only for old Windows builds where number 5 crashed - fixed by Valve).
l4d2_unique_survivors_zoey5 "1"
