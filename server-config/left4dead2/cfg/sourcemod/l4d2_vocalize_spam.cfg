// [L4D2] Vocalize Spam
// 1 = voice lines can be spammed, 0 = off
l4d2_vocalize_spam_enable "1"
// Minimum seconds between one player's voice lines (0 = no limit)
l4d2_vocalize_spam_interval "0.1"
// 1 = new lines play on top of the current one, 0 = new lines cut off the current one
l4d2_vocalize_spam_stack "1"
// 1 = key binds / console "vocalize <line>" work (e.g. bind v "vocalize PlayerLaugh")
l4d2_vocalize_spam_binds "1"
// 1 = log vocalize commands and scene starts to the server console
l4d2_vocalize_spam_debug "0"
