// [L4D2] Survivor Set
// Needs the l4d2_survivorset.vpk addon in left4dead2/addons (server AND every player).
// 1 = also report set 2 on set-1 maps server-side (Left4DHooks). Not needed when the server has the addon.
l4d2_survivor_set_override "0"
// Map name prefixes of the L4D1-cast campaigns. Bots spawning there as the L4D2 cast become the L4D1 cast.
l4d2_survivor_set_maps "c7m,c8m,c9m,c10m,c11m,c12m,c14m"
// 1 = the Zoey bot gets character number 5 (her own HUD portrait). 0 = she keeps Rochelle's number (only for old Windows builds where number 5 crashed - fixed by Valve).
l4d2_survivor_set_zoey5 "1"
// 1 = log changes to the server console
l4d2_survivor_set_debug "0"
