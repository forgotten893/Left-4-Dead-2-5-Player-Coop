// Left 4 Dead 2 dedicated server - 5 player coop
// Plugins: L4DToolZ, Metamod:Source, SourceMod, left4dhooks, l4dmultislots, l4d_CreateSurvivorBot

hostname "L4D2 5-Player Coop"
sv_password ""                  // set a password to keep strangers out
rcon_password ""                // set this if you want remote console access

// --- Player slots (L4DToolZ) ---
sv_maxplayers 5                 // max players allowed on the server (up to 31)
sv_force_unreserved 1           // no lobby matchmaking; the lobby would cap coop at 4 players
sv_allow_lobby_connect_only 0   // allow direct "connect <ip>" joins

// --- Game ---
mp_gamemode "coop"
// Difficulty is set once at startup in "Start L4D2 Server.bat" (Expert), not here:
// server.cfg runs on every map load and would undo changes made from the !admin menu.
sv_gametypes "coop,realism,survival,versus,scavenge"
sv_region 255                   // 255 = world
sv_lan 0

// --- Recommended for 5+ survivors (fbef0102 8+ survivors guide) ---
sm_cvar precache_all_survivors 1   // load every survivor model up front to avoid crashes
sm_cvar sv_consistency 0

// --- HUD Display Manager (shows your nearest 3 teammates in the team HUD) ---
sm_l4d2_hud_display_query_time 0.5   // seconds between nearest-teammate checks (plugin default 3)
sm_l4d2_hud_display_display_fourth 1 // use the 4th teammate slot (author notes it can be buggy)

// --- Logging ---
log on
sv_logbans 1
